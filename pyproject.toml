[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-project-creator"
version = "1.0.0"
description = "Create ready-to-edit DaVinci Resolve Studio projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["PySide6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
video-project-creator = "video_project_creator.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
